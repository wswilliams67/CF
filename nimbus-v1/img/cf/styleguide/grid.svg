<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" fill="none">
  <style>
    .col { fill: #33b5e5; stroke: #fff; stroke-width: 2; opacity: 0.85; }
    .gutter { fill: #e9ecef; }
    .label { font-family: 'Nunito Sans', Arial, sans-serif; font-size: 11px; fill: #fff; text-anchor: middle; dominant-baseline: central; }
    .header { font-family: 'Nunito Sans', Arial, sans-serif; font-size: 13px; fill: #666; text-anchor: middle; dominant-baseline: central; font-weight: 600; }
  </style>
  <!-- Container outline -->
  <rect x="0" y="0" width="800" height="200" rx="4" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <!-- Header labels -->
  <text x="400" y="20" class="header">12-Column Grid System</text>
  <!-- Row 1: 12 equal columns -->
  <g transform="translate(16, 40)">
    <rect class="col" x="0" y="0" width="62" height="40" rx="3"/>
    <text class="label" x="31" y="20">1</text>
    <rect class="col" x="64" y="0" width="62" height="40" rx="3"/>
    <text class="label" x="95" y="20">2</text>
    <rect class="col" x="128" y="0" width="62" height="40" rx="3"/>
    <text class="label" x="159" y="20">3</text>
    <rect class="col" x="192" y="0" width="62" height="40" rx="3"/>
    <text class="label" x="223" y="20">4</text>
    <rect class="col" x="256" y="0" width="62" height="40" rx="3"/>
    <text class="label" x="287" y="20">5</text>
    <rect class="col" x="320" y="0" width="62" height="40" rx="3"/>
    <text class="label" x="351" y="20">6</text>
    <rect class="col" x="384" y="0" width="62" height="40" rx="3"/>
    <text class="label" x="415" y="20">7</text>
    <rect class="col" x="448" y="0" width="62" height="40" rx="3"/>
    <text class="label" x="479" y="20">8</text>
    <rect class="col" x="512" y="0" width="62" height="40" rx="3"/>
    <text class="label" x="543" y="20">9</text>
    <rect class="col" x="576" y="0" width="62" height="40" rx="3"/>
    <text class="label" x="607" y="20">10</text>
    <rect class="col" x="640" y="0" width="62" height="40" rx="3"/>
    <text class="label" x="671" y="20">11</text>
    <rect class="col" x="704" y="0" width="62" height="40" rx="3"/>
    <text class="label" x="735" y="20">12</text>
  </g>
  <!-- Row 2: 4-4-4 -->
  <g transform="translate(16, 90)">
    <rect class="col" x="0" y="0" width="252" height="40" rx="3"/>
    <text class="label" x="126" y="20">col-4</text>
    <rect class="col" x="256" y="0" width="252" height="40" rx="3"/>
    <text class="label" x="382" y="20">col-4</text>
    <rect class="col" x="512" y="0" width="254" height="40" rx="3"/>
    <text class="label" x="639" y="20">col-4</text>
  </g>
  <!-- Row 3: 8-4 -->
  <g transform="translate(16, 140)">
    <rect class="col" x="0" y="0" width="508" height="40" rx="3"/>
    <text class="label" x="254" y="20">col-8</text>
    <rect class="col" x="512" y="0" width="254" height="40" rx="3"/>
    <text class="label" x="639" y="20">col-4</text>
  </g>
</svg>
