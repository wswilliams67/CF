<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cloudficient Loader Animation</title>

    <!-- Preconnect to Google Fonts for faster loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400&display=swap"
      rel="stylesheet"
    />

    <style>
      /* ===== BASE STYLES ===== */
      body {
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #f5f5f5;
      }

      /* ===== LOADER CONTAINER ===== */
      /* Container holds both the SVG animation and text label */
      .loader-container {
        width: 150px; /* Optimized size (75% of original 200px) */
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      /* Allow SVG to overflow container for full visibility without clipping */
      .loader-container svg {
        overflow: visible;
      }

      /* ===== LOADING TEXT ===== */
      .loading-text {
        margin-top: 24px; /* Space between animation and text */
        color: #5ccb59; /* Matches inner arc color */
        font-size: 24px;
        font-family: "Nunito Sans", sans-serif;
        font-weight: normal;
        letter-spacing: 0.05em; /* Slight letter spacing for readability */
      }

      /* ===== KEYFRAME ANIMATIONS ===== */

      /* Inner shape animation: Clockwise rotation along arc
       * Timeline (5s total):
       * 0-0.625s (0-12.5%): Pause at start (-2.5°)
       * 0.625-2.5s (12.5-50%): Slide to end (142°)
       * 2.5-4.375s (50-87.5%): Slide back to start (-2.5°)
       * 4.375-5s (87.5-100%): Pause at start (-2.5°)
       */
      @keyframes slideInner {
        0%,
        12.5% {
          transform: rotate(-2.5deg);
        }
        50% {
          transform: rotate(142deg);
        }
        87.5%,
        100% {
          transform: rotate(-2.5deg);
        }
      }

      /* Outer shape animation: Counter-clockwise rotation along arc
       * Same timing as inner, but rotates in opposite direction
       * Creates "bead on string" effect moving opposite to inner shape
       */
      @keyframes slideOuter {
        0%,
        12.5% {
          transform: rotate(1.5deg);
        }
        50% {
          transform: rotate(-141.5deg);
        }
        87.5%,
        100% {
          transform: rotate(1.5deg);
        }
      }

      /* ===== ANIMATION CLASSES ===== */

      /* Inner filled shape - Green arc segment that slides clockwise */
      .inner-filled-animated {
        transform-origin: 78px 77.635px; /* Precisely positioned rotation center */
        animation: slideInner 5s ease-in-out infinite;
      }

      /* Outer filled shape - Light green arc segment that slides counter-clockwise */
      .outer-filled-animated {
        transform-origin: 77px 79.5px; /* Precisely positioned rotation center */
        animation: slideOuter 5s ease-in-out infinite;
      }
    </style>
  </head>
