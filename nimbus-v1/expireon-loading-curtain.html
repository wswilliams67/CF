<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ExpireOn Loading Curtain</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: white;
        overflow: hidden;
      }

      .loading-curtain {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
      }

      .loading-curtain svg {
        width: 116px;
        height: 113px;
      }

      .loading-curtain svg {
        width: 100%;
        height: 100%;
      }

      /* Top Wing Animation */
      .top-wing {
        animation: clipRightToLeft 3s ease-in-out infinite;
        animation-delay: 0s;
      }

      /* Middle Wing Animation */
      .middle-wing {
        animation: clipRightToLeft 3s ease-in-out infinite;
        animation-delay: 0.25s;
      }

      /* Bottom Wing Animation */
      .bottom-wing {
        animation: clipRightToLeft 3s ease-in-out infinite;
        animation-delay: 0.5s;
      }

      /* Line Animation */
      .line {
        animation: fadeInOut 1.5s ease-in-out infinite;
      }

      @keyframes slideBottom {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(10px);
        }
      }

      @keyframes slideTop {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(0.95);
        }
      }

      @keyframes collapseDiagonal {
        0%,
        100% {
          transform: rotate(-45deg) scaleX(1) rotate(45deg);
        }
        50% {
          transform: rotate(-45deg) scaleX(0) rotate(45deg);
        }
      }

      @keyframes collapseToDiagonal {
        0%,
        100% {
          transform: scaleX(1) skewY(0deg);
        }
        50% {
          transform: scaleX(0.01) skewY(0deg);
        }
      }

      @keyframes collapseWidth {
        0%,
        100% {
          transform: scaleX(1);
        }
        50% {
          transform: scaleX(0);
        }
      }

      @keyframes collapseToLine {
        0%,
        100% {
          transform: scaleX(1);
        }
        50% {
          transform: scaleX(0.01);
        }
      }

      @keyframes clipRightToLeft {
        0% {
          clip-path: inset(0 0 0 0);
        }
        16.67% {
          clip-path: inset(0 100% 0 0);
        }
        33.33% {
          clip-path: inset(0 0 0 0);
        }
        100% {
          clip-path: inset(0 0 0 0);
        }
      }

      @keyframes fadeInOut {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 1;
        }
      }

      .loading-text {
        color: #4d45d6;
        font-family: "Nunito Sans", sans-serif;
        font-size: 24px;
        font-weight: normal;
        letter-spacing: 2px;
        white-space: nowrap;
        text-transform: capitalize;
      }
    </style>
  </head>
  <body>
    <div class="loading-curtain">
      <svg
        width="116"
        height="113"
        viewBox="0 0 116 113"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <!-- Bottom Wing -->
        <path
          class="bottom-wing"
          d="M116 113V103.023C116 91.5338 106.672 82.2368 95.1458 82.2368H33.0385L63.9026 113H116Z"
          fill="#4D45D6"
        />

        <!-- Top Wing -->
        <path
          class="top-wing"
          d="M116 0V9.97726C116 21.441 106.672 30.7632 95.1458 30.7632H33.0385L63.9026 0H116Z"
          fill="#4D45D6"
        />

        <!-- Middle Wing -->
        <path
          class="middle-wing"
          d="M16.1277 47.9715C13.7263 50.365 12.5129 53.5144 12.5129 56.6638C12.5129 59.8132 13.7263 62.9626 16.1277 65.3561L25.6574 74.8547H93.6292V38.4478H25.6574L16.1277 47.9463V47.9715Z"
          fill="#827DE3"
        />

        <!-- Line -->
        <path
          class="line"
          d="M53.5894 113L12.3867 71.932C8.59508 68.1527 6.04202 63.1893 5.71341 57.8479C5.33425 51.7003 7.55869 45.8803 11.8812 41.5719L53.5894 0H47.7756C46.3347 0 44.9697 0.57949 43.9586 1.58729L7.86202 37.5659C2.50314 42.9072 -0.302688 50.0626 0.0259227 57.6464C0.329255 64.6002 3.53953 71.1005 8.49396 76.0388L43.807 111.236C44.9445 112.37 46.4864 113 48.0789 113H53.6147H53.5894Z"
          fill="#4D45D6"
        />
      </svg>
      <div class="loading-text">LOADING</div>
    </div>
  </body>
</html>
