trigger:
  - master

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
  - task: AzureStaticWebApp@0
    inputs:
      app_location: '/' # App source code path relative to cwd
      skip_app_build: true
      skip_api_build: true
      output_location: ''
      azure_static_web_apps_api_token: $(azure_static_webapp_deployment_token)