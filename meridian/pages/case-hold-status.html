<!doctype html>
<!--
  Hold Status tab (PRD 07 §7.1–7.2) — Meridian Biopharma demo.

  Files
    js/demo/case-hold-status.js   controller: data contract, state, render, actions (start there)
    css/demo/hold-status.css      page-scoped layout; every component is Nimbus
    js/demo/hold-status-help.js   copy for the "How hold status works" panel
    js/demo/shell.js              shared: case header, dialogs, panels, toasts, cancel confirmation
    data/meridian.js              fixture: M.holdStatusSources(), M.segmentOf(), freshness

  This file holds only the static frame; #hsTiles, #hsTable, #hsFresh, #hsFresh2 and #hsFooterCount
  are filled by the controller. Design: Figma 13-PRDs, page "PRD 07 · Hold Status". Where the
  board and the PRD differ, the PRD wins: five cards (Imported shown at 0), three freshness
  regimes, counts that sum to the total, an EXCEPTION badge on every affected row, no OPEN IN PURVIEW.
-->
<html lang="en" data-cnds-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Hold status · Meridian Biopharma · CaseFusion</title>
    <link rel="stylesheet" href="../css/nimbus.css?v=20261015170428" />
    <link rel="stylesheet" href="../css/app.css?v=20261015170428" />
    <link rel="stylesheet" href="../css/themes/primitives.css?v=20261015170428" />
    <link rel="stylesheet" href="../css/themes/light.css?v=20261015170428" />
    <link rel="stylesheet" href="../css/themes/dark.css?v=20261015170428" />
    <link rel="stylesheet" href="../css/pages/frame-ca-sidenav.css?v=20261015170428" />
    <link rel="stylesheet" href="../css/demo/demo.css?v=20261015170428" />
    <link rel="stylesheet" href="../css/demo/hold-status.css?v=20261015170428" />
    <link rel="icon" type="image/png" sizes="32x32" href="../img/favicon/favicon-32x32.png" />
  </head>
  <body class="cnds-product-casefusion" data-demo-tab="holdstatus">
    <main id="main-content" class="ca-main">
      <div class="ca-content" id="caContent">
        <div data-demo-case-header></div>

        <!-- Freshness: the three regimes in one line, never one merged clock (H60, H112). -->
        <div class="btn-toolbar-gray btn-toolbar-list mb-3" role="toolbar" aria-label="Hold status freshness">
          <div class="toolbar-list-controls hs-fresh">
            <span class="badge badge-success" id="hsChip">Current</span>
            <div class="vr vr-blurry" aria-hidden="true"></div>
            <span class="small" id="hsFresh"></span>
            <div class="vr vr-blurry" aria-hidden="true"></div>
            <a href="#" class="hs-help-link" data-hs-help aria-haspopup="dialog"><i class="mdi mdi-help mdi-18px me-2" aria-hidden="true"></i>How hold status works</a>
          </div>
        </div>

        <!-- Segment tiles: a partition of the case's sources. Each is a filter. -->
        <div class="demo-tiles hs-tiles" id="hsTiles" role="group" aria-label="Hold status segments"></div>

        <section aria-labelledby="hsSourcesTitle">
          <!-- Heading fills the line; the case's source counts and the note sit at the right, split by a blurry divider (Scott, 10-14). -->
          <div class="hs-sources-head">
            <h2 id="hsSourcesTitle" class="cf-category cf-cat-6 highlight-casefusion mb-0 flex-grow-1">Sources</h2>
            <div class="hs-sources-meta">
              <span class="hs-sources-count" id="hsFooterCount" aria-live="polite"></span>
              <div class="vr vr-blurry" aria-hidden="true"></div>
              <span class="text-muted hs-sources-note">Status as read from Purview, and attestations for what it cannot read.</span>
            </div>
          </div>
          <div id="hsTable"></div>
        </section>

        <div class="mb-3"></div>

        <div class="btn-toolbar-gray btn-toolbar-action btn-toolbar-floating hs-actionbar" role="toolbar" aria-label="Hold status actions">
          <span class="hs-bar-fresh" id="hsFresh2"></span>
          <div class="toolbar-action-end">
            <a class="btn btn-secondary" href="case-coverage.html">BACK TO CASE</a>
            <button type="button" class="btn btn-secondary" data-hs-export>EXPORT HOLD STATUS</button>
            <button type="button" class="btn btn-primary" data-hs-refresh-case>REFRESH CASE</button>
          </div>
        </div>
      </div>
    </main>
    <script src="../data/meridian.js?v=20261015170428"></script>
    <script src="../js/demo/hold-status-help.js?v=20261015170428"></script>
    <script src="../js/demo/shell.js?v=20261015170428"></script>
    <script src="../js/nimbus.js?v=20261015170428"></script>
    <script src="../js/app.js?v=20261015170428"></script>
    <script src="../js/pages/frame-ca-sidenav.js?v=20261015170428"></script>
    <script src="../js/demo/case-hold-status.js?v=20261015170428"></script>
  </body>
</html>
