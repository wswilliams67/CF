* ════════════════════════════════════════════════════════════════════════════
* Nimbus v1 Portable Design System — CaseFusion
* Page:   CF Case Administrator — Home
* File:   cf_ca_home.html   (based on tmpl_cf_ca_full.html)
* Role:   Case Administrator
* Figma:  Redwell v2.0 — Case Administrator › Dashboard (6331:118534)
* Docs:   for-claude/cf_ca_home-dev-plan.md
*         for-claude/cf_ca_home-angular-conversion.md   ← handoff spec
* ════════════════════════════════════════════════════════════════════════════
*
* LAYOUT
* ──────
* ┌─────────────────────────────────────────────────────────────────────────┐
* │ Sticky header                                                           │
* │  ├── Utility nav: logo · search · home · my cases · bell · theme ·      │
* │  │                portal switcher · account                             │
* │  └── Page title bar: "Home" + stripe                                    │
* ├─────────────────────────────────────────────────────────────────────────┤
* │ System alert (dismissible)                                              │
* │ "Requires Action" accordion (collapsed by default)                      │
* │ 3 × 3 card grid — drag-reorderable, per-user persistent order           │
* │ Reset layout (only visible when the order differs from default)         │
* └─────────────────────────────────────────────────────────────────────────┘
*
* There is NO primary tab nav on this page — it was removed along with the
* tab panes, so tabs.css / tabs.js are deliberately not loaded.
*
* DATA
* ────
* Every card, row, badge, tile, ring and chart series is rendered from the
* DASHBOARD_DATA object in SCREEN CONFIGURATION. No content is hand-written
* markup. Badges and the "Across N cases" subtitles are DERIVED from the
* arrays (deriveCard), so they can never disagree with what is listed.
* To wire the API: replace the DASHBOARD_DATA literal with a fetch() that
* resolves to the same shape, then call renderDashboard(data, order).
*
* CARD ORDER
* ──────────
* Per user, persistent across sessions. LayoutStore is the ONLY place the
* backing store is decided — localStorage today, cookie or API later. Its
* load/save/clear are callback-based so an async store swaps in without
* touching a single caller.
*
* THEMES
* ──────
* Ships dark (per Figma) but is fully specified for light. #themeToggle in
* the utility nav flips data-cnds-theme on <html>. Every .cfd-* rule resolves
* colour from a --cfd-* token declared for BOTH themes — no literal hex lives
* inside a component rule.
*
* PORTABLE
* ────────
* All assets are relative and self-contained: ../css ../js ../img ../fonts
* ../plugins. Deploy the casefusion/2.0 folder anywhere and it resolves.
*
* NIMBUS NOTES / GOTCHAS
* ──────────────────────
* • nimbus.js loads components ASYNC and fires cnds.ready ONCE. Anything
*   needing a component must go through whenNimbusReady() — a plain
*   cnds.ready listener added after boot never fires (this silently killed
*   the chart on re-render).
* • Component scripts are cache-busted only by Nimbus.VERSION in nimbus.js.
*   Editing a component file WITHOUT bumping that version will not reach a
*   warm browser.
* • .visually-hidden is position:absolute !important — never place it inside
*   a scrolling container with no positioned ancestor; it stretches the page.
* • #UtilityNav sets overflow-x:clip, so dropdowns inside it must be
*   position:fixed or they get clipped in WebKit.
-->

    <style>
      /* ───────────────────────────────────────────────────────────────────
         UTILITY NAV — Nimbus Header component styles
         (adapted from cnds-header.html; scoped to #UtilityNav)
         ─────────────────────────────────────────────────────────────────── */

      /* Semantic tokens shared by nav components */
      :root {
        --cnds-tooltip-bg: #525252;
        --cnds-tooltip-color: #e8e8e8;
        --cnds-btn-tertiary-hover-bg: #b4c8e5;
        --cnds-btn-tertiary-hover-color: #1a4480;
        --cnds-btn-tertiary-active-bg: #8fadd6;
        --cnds-btn-tertiary-active-color: #112d56;
        --cnds-btn-tertiary-focused-bg: #b4c8e5;
        --cnds-btn-tertiary-focused-border: #112d56;
        --cnds-btn-tertiary-focused-color: #1a4480;
      }
      :root, [data-cnds-theme="light"] {
        --cnds-surface-sunken: #ebebeb;
        --cnds-border-strong: #cccccc;
        --cnds-list-hover-bg: #e0e0e0;
        --cnds-list-active-bg: #2e892a;
        --cnds-list-active-color: #fff;
        --cnds-btn-tertiary-color: #215aab;
        --cnds-menu-item-bg: #ffffff;
        --cnds-menu-item-color: #4f4f4f;
      }
      [data-cnds-theme="dark"] {
        --cnds-surface-sunken: #171717;
        --cnds-border-strong: #787878;
        --cnds-list-hover-bg: #4a4a4a;
        --cnds-list-active-bg: #1d5a1d;
        --cnds-list-active-color: #7dd67a;
        --cnds-btn-tertiary-color: #6790ca;
        --cnds-menu-item-bg: #1e1e1e;
        --cnds-menu-item-color: #ebebeb;
      }

      /* display:flex !important overrides app.css #UtilityNav:not(:has(li)){display:none}
         which hides the nav when there are no <li> elements (Nimbus menus use <div><a>) */
      #UtilityNav {
        display: flex !important;
        flex-wrap: nowrap !important;
        overflow-x: clip;
        align-items: center;
        height: 50px;
        padding-top: 0 !important;
        padding-bottom: 0 !important;
        --demo-nav-bg: var(--cnds-surface-light-200, #ebebeb);
        --demo-nav-fg: var(--cnds-surface-light-950, #141414);
        background-color: var(--demo-nav-bg) !important;
        color: var(--demo-nav-fg) !important;
        gap: 48px;
      }
      [data-cnds-theme="dark"] #UtilityNav {
        --demo-nav-bg: var(--cnds-surface-dark-600, #171717);
        --demo-nav-fg: var(--cnds-surface-dark-50, #e8e8e8);
      }
      #UtilityNav .fr_product-name { gap: 0; }
      #UtilityNav .fr_product-name,
      #UtilityNav .product-bold,
      #UtilityNav .product-light,
      #UtilityNav .nav-cf-utility-user,
      #UtilityNav .user-name-label,
      #UtilityNav .portal-switcher-label { color: var(--demo-nav-fg) !important; }
      #UtilityNav .fr_tools { flex: 1; min-width: 0; justify-content: flex-end; }
      #UtilityNav .nav-cf-utility-user { flex-shrink: 0; }

      /* Nav Search */
      .nav-search-wrapper { flex: 1; display: flex; align-items: center; justify-content: flex-end; gap: 8px; min-width: 0; }
      .nav-search-panel { flex: 1; min-width: 0; overflow: hidden; max-width: 0; transition: none; display: flex; align-items: center; }
      .nav-search-panel.open { max-width: 9999px; }
      .nav-search-fields { display: flex; align-items: center; gap: 8px; padding-right: 4px; flex: 1; min-width: 0; }
      .nav-search-input-wrapper { flex: 1; min-width: 0; position: relative; }
      .form-outline-casefusion {
        --cnds-input-focus-border-color: var(--cnds-product-casefusion-green-700, #2e892a);
        --cnds-input-focus-box-shadow: inset 0 0 0 1px var(--cnds-product-casefusion-green-700, #2e892a);
      }
      [data-cnds-theme="dark"] .form-outline-casefusion {
        --cnds-input-focus-border-color: var(--cnds-product-casefusion-green-400, #7dd67a);
        --cnds-input-focus-box-shadow: inset 0 0 0 1px var(--cnds-product-casefusion-green-400, #7dd67a);
      }
      .nav-search-input::-webkit-search-cancel-button { display: none; }
      .nav-search-clear-btn { position: absolute; top: 50%; transform: translateY(-50%); right: 6px; background: none; border: none; padding: 0; cursor: pointer; z-index: 99; line-height: 1; font-size: 1rem; display: none; align-items: center; justify-content: center; color: var(--demo-nav-fg, #4f4f4f); opacity: 0.53; }
      .nav-search-clear-btn:hover { opacity: 0.8; }
      .nav-search-clear-btn.visible { display: flex; }
      .nav-search-input { height: 38px !important; padding: 0.375rem 0.75rem; font-size: 13px; color: var(--cnds-input-color, #4f4f4f); background-color: var(--cnds-input-bg, #fff); border-color: var(--cnds-input-border-color, #bdbdbd); border-radius: var(--cnds-input-border-radius, 0.25rem); }
      .nav-search-input:focus { border-color: var(--cnds-input-focus-border-color, #2e892a); box-shadow: var(--cnds-input-focus-box-shadow, inset 0 0 0 1px #2e892a); outline: none; }
      .nav-search-input::placeholder { color: var(--cnds-input-placeholder-color, #757575); opacity: 1; }
      [data-cnds-theme="dark"] .nav-search-input::placeholder { color: var(--cnds-input-placeholder-color, #bebebe); }
      .nav-search-category { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
      .nav-search-cat-label { font-size: 0.875rem; font-weight: 500; color: var(--cnds-body-color); white-space: nowrap; }
      .nav-search-category .select-wrapper { --cnds-select-input-bg: var(--cnds-input-bg); --cnds-select-input-border-color: var(--cnds-input-border-color, #bdbdbd); --cnds-select-input-color: var(--cnds-input-color); flex-shrink: 0; }
      .nav-search-category .select-input { height: 38px !important; padding-top: 0 !important; padding-bottom: 0 !important; padding-left: 12px !important; font-size: 13px; }
      .nav-search-submit { height: 34px; padding: 0 12px; background: transparent; border: none; border-radius: 8px; color: var(--cnds-btn-tertiary-color, #215aab); font-size: 12px; font-weight: 800; font-family: "Nunito Sans", sans-serif; text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; white-space: nowrap; flex-shrink: 0; transition: background 0.15s, color 0.15s; }
      .nav-search-submit:hover { background: var(--cnds-btn-tertiary-hover-bg); color: var(--cnds-btn-tertiary-hover-color); }
      .nav-search-submit:active { background: var(--cnds-btn-tertiary-active-bg); color: var(--cnds-btn-tertiary-active-color); }
      .nav-search-submit:focus-visible { background: var(--cnds-btn-tertiary-focused-bg); outline: 2px solid var(--cnds-btn-tertiary-focused-border); color: var(--cnds-btn-tertiary-focused-color); }
      .nav-search-filter-btn { width: 34px; height: 34px; padding: 0; background: transparent; border: none; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; transition: background 0.15s; }
      .nav-search-filter-btn .mdi { font-size: 16px; color: var(--cnds-btn-tertiary-color, #215aab); transition: color 0.15s; }
      .nav-search-filter-btn:hover { background: var(--cnds-btn-tertiary-hover-bg); }
      .nav-search-filter-btn:hover .mdi { color: var(--cnds-btn-tertiary-hover-color); }
      .nav-search-filter-btn:active { background: var(--cnds-btn-tertiary-active-bg); }
      .nav-search-filter-btn:active .mdi { color: var(--cnds-btn-tertiary-active-color); }
      .nav-search-filter-btn:focus-visible { background: var(--cnds-btn-tertiary-focused-bg); outline: 2px solid var(--cnds-btn-tertiary-focused-border); }
      .nav-search-toggle { width: 32px; height: 32px; padding: 0; background: none; border: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; transition: background 0.2s; }
      .nav-search-toggle .mdi { font-size: 24px; color: var(--demo-nav-fg, #4f4f4f); transition: color 0.2s; }
      .nav-search-toggle.active { background: var(--cnds-link-color, #215aab); }
      .nav-search-toggle.active .mdi { color: #fff; }

      /* Utility Divider */
      .utility-divider { display: inline-block; width: 1px; height: 24px; background: var(--demo-nav-fg, #e0e0e0); opacity: 0.25; flex-shrink: 0; }

      /* Nav Icon Button — also used as an <a> for Home / My Cases */
      .nav-icon-btn { position: relative; background: none; border: none; cursor: pointer; padding: 4px; display: flex; align-items: center; border-radius: 4px; flex-shrink: 0; text-decoration: none; }
      .nav-icon-btn .mdi { font-size: 24px; color: var(--demo-nav-fg, #4f4f4f); }
      /* No hover state on Home / My Cases by design. focus-visible is kept —
         it is a keyboard affordance, not a hover effect. */
      a.nav-icon-btn:focus-visible { outline: 2px solid var(--cnds-link-color, #6790ca); }

      /* Portal Switcher */
      .portal-switcher-wrapper { position: relative; display: flex; align-items: center; height: 32px; flex-shrink: 0; white-space: nowrap; }
      .portal-switcher { display: inline-flex; align-items: center; gap: 4px; font-size: 0.875rem; color: var(--demo-nav-fg, #4f4f4f); cursor: pointer; flex-shrink: 0; white-space: nowrap; }
      .portal-switcher .mdi { color: var(--demo-nav-fg, #4f4f4f); flex-shrink: 0; }
      .portal-switcher-label, .user-name-label { overflow: hidden; white-space: nowrap; max-width: 200px; line-height: normal; }
      .nav-labels-collapsed .portal-switcher-label, .nav-labels-collapsed .user-name-label { max-width: 0; }
      .nav-labels-collapsing .portal-switcher-label, .nav-labels-collapsing .user-name-label { transition: max-width 0.4s ease-in; }
      @media (prefers-reduced-motion: reduce) {
        .nav-labels-collapsing .portal-switcher-label, .nav-labels-collapsing .user-name-label { transition: none; }
      }

      /* User Info */
      .user-info-wrapper { position: relative; display: flex; align-items: center; height: 32px; flex-shrink: 0; white-space: nowrap; }
      .user-info { display: inline-flex; align-items: center; gap: 8px; font-size: 0.875rem; color: var(--demo-nav-fg, #4f4f4f); white-space: nowrap; cursor: pointer; flex-shrink: 0; }
      .user-name-label { flex-shrink: 0; }
      .user-avatar { width: 24px; height: 24px; border-radius: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: var(--cnds-product-casefusion-green-500, #5ccb59); color: #030303; font-family: "Nunito Sans", sans-serif; font-weight: 700; font-size: 12px; letter-spacing: -0.5px; line-height: 1; box-sizing: border-box; user-select: none; }

      /* Account / Portal Dropdown Menu */
      /* position:fixed, not absolute. #UtilityNav sets overflow-x:clip, and
         engines disagree on what the other axis then computes to — WebKit
         clips the dropdown, Chrome does not. Fixed escapes ancestor overflow
         entirely (the header sets no transform/filter, so it is not a fixed
         containing block). Coordinates are set by positionMenu() on open. */
      .account-menu { display: none; position: fixed; min-width: 180px; background: var(--cnds-menu-item-bg); border: 1px solid var(--cnds-border-strong); border-radius: 8px; box-shadow: 0 2px 15px -3px rgba(0,0,0,.07), 0 10px 20px -2px rgba(0,0,0,.04), 0 0 60px 10px rgba(0,0,0,.2); z-index: 1000; flex-direction: column; }
      .account-menu.open { display: flex; }
      .account-menu::before { content: ""; position: absolute; top: -9px; right: var(--menu-arrow-outer, 12px); width: 0; height: 0; border-style: solid; border-width: 0 8px 9px 8px; border-color: transparent transparent var(--cnds-border-strong) transparent; }
      .account-menu::after  { content: ""; position: absolute; top: -7px; right: var(--menu-arrow-inner, 13px); width: 0; height: 0; border-style: solid; border-width: 0 7px 8px 7px; border-color: transparent transparent var(--cnds-surface-sunken) transparent; }
      .account-menu-header { background: var(--cnds-surface-sunken); padding: 12.5px 16px; font-family: "Nunito Sans", sans-serif; font-weight: 700; font-size: 0.875rem; letter-spacing: 1.4px; text-transform: uppercase; color: var(--cnds-body-color); line-height: 1.4; border-radius: 8px 8px 0 0; }
      .account-menu-item { background: var(--cnds-menu-item-bg) !important; padding: 6px 16px; height: 44px; display: flex; align-items: center; font-family: "Nunito Sans", sans-serif; font-weight: 400; font-size: 0.875rem; color: var(--cnds-menu-item-color) !important; line-height: 1.2; cursor: pointer; text-decoration: none; transition: background 0.15s ease; }
      .account-menu-item:last-child { border-radius: 0 0 8px 8px; }
      .account-menu-item:hover { background: var(--cnds-list-hover-bg) !important; }
      .account-menu-item.active { background: var(--cnds-list-active-bg) !important; color: var(--cnds-list-active-color) !important; }

      /* Nav Alert Popover Wrapper */
      .nav-alert-popover-wrapper { position: relative; display: flex; align-items: center; }

      /* Notification Popover */
      .notif-popover { position: fixed; left: 0; bottom: 16px; width: 400px; max-height: 480px; z-index: 1060; display: none; flex-direction: column; border: 1px solid var(--cnds-border-strong); border-radius: 8px; overflow: visible; background: var(--cnds-body-bg, #fff); box-shadow: 0 2px 15px -3px rgba(0,0,0,.07), 0 10px 20px -2px rgba(0,0,0,.04), 0 0 60px 10px rgba(0,0,0,.2); font-family: "Nunito Sans", sans-serif; color: var(--cnds-body-color, #4f4f4f); }
      .notif-popover.open { display: flex; }
      .notif-popover::before { content: ""; position: absolute; top: -9px; left: var(--arrow-left, 12px); width: 0; height: 0; border-style: solid; border-width: 0 8px 9px 8px; border-color: transparent transparent var(--cnds-border-strong) transparent; z-index: 1; }
      .notif-popover::after  { content: ""; position: absolute; top: -7px; left: calc(var(--arrow-left, 12px) + 1px); width: 0; height: 0; border-style: solid; border-width: 0 7px 8px 7px; border-color: transparent transparent var(--cnds-surface-sunken) transparent; z-index: 2; }
      .notif-header { display: flex; align-items: flex-start; justify-content: space-between; padding: 12px 16px; background: var(--cnds-surface-sunken); border-radius: 8px 8px 0 0; flex-shrink: 0; position: relative; z-index: 1; }
      .notif-header.scrolled::after { content: ""; position: absolute; left: 0; right: 0; bottom: -12px; height: 12px; background: linear-gradient(to bottom, rgba(0,0,0,.45), transparent); pointer-events: none; }
      .notif-header-title { font-weight: 700; font-size: 0.875rem; letter-spacing: 1.4px; text-transform: uppercase; line-height: 1.4; color: var(--cnds-body-color, #4f4f4f); }
      .notif-header-counts { display: flex; align-items: center; gap: 8px; font-weight: 400; font-size: 12px; line-height: 1.43; color: var(--cnds-body-color, #4f4f4f); }
      .notif-header-divider { display: inline-block; width: 1px; height: 16px; background: var(--cnds-border-strong); }
      .notif-list { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; min-height: 0; border-radius: 0 0 8px 8px; }
      .notif-list::-webkit-scrollbar { width: 8px; }
      .notif-list::-webkit-scrollbar-track { background: transparent; }
      .notif-list::-webkit-scrollbar-thumb { background: transparent; border-radius: 4px; }
      .notif-list:hover::-webkit-scrollbar-thumb { background: var(--cnds-border-strong); }
      .notif-list:hover::-webkit-scrollbar-track { background: var(--cnds-input-bg, #fff); }
      .notif-item { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 16px 8px 16px 16px; border-top: 1px solid var(--cnds-border-strong); background: var(--cnds-body-bg, #fff); }
      .notif-unread-dot { display: none; }
      .notif-item.unread .notif-unread-dot { display: block; position: absolute; left: 5px; top: 4px; width: 8px; height: 8px; border-radius: 999px; background: #c23400; pointer-events: none; }
      .notif-item.unread .notif-subject { font-weight: 700; }
      .notif-item.unread .notif-timestamp { font-weight: 700; }
      .notif-item-label { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; }

    <script>
      (function () {
        "use strict";

        /* ── 1. Scroll shadow (header is position:sticky — no paddingTop needed) ── */
        var header = document.getElementById("caHeader");
        var main   = document.getElementById("main-content");

        /* ── 2. Scroll shadow ── */
        window.addEventListener("scroll", function () {
          if (header) header.classList.toggle("shadow-sm", window.scrollY > 0);
        }, { passive: true });

        /* ── 4. Utility Nav ── */
        var DEMO_NOTIFICATIONS = [
          { subject: "Legal hold violation detected",      timestamp: "Apr 18, 2026 · 2:14 PM",  message: "Legal hold violation detected on custodian mailbox. Immediate review required to prevent spoliation.", unread: true  },
          { subject: "Preserve in place job completed",    timestamp: "Apr 18, 2026 · 11:05 AM", message: "Preserve in place job for OneDrive has completed in Doe v. Acme Corporation.", unread: true  },
          { subject: "Custodian response overdue",         timestamp: "Apr 17, 2026 · 2:00 PM",  message: "Custodian response is overdue by 5 days. Escalation notice sent to outside counsel.", unread: true  },
          { subject: "Expert report deadline approaching", timestamp: "Apr 17, 2026 · 10:45 AM", message: "Expert report deadline is approaching in 3 business days. Draft review recommended.", unread: false },
          { subject: "Data source sync completed",         timestamp: "Apr 16, 2026 · 4:12 PM",  message: "Data source sync completed for Exchange Online connector.", unread: false }
        ];

        function renderDemoNotifications(listEl, data) {
          listEl.innerHTML = "";
          data.forEach(function (item) {
            var div = document.createElement("div");
            div.className = "notif-item" + (item.unread ? " unread" : "");
            var html = item.unread ? '<span class="notif-unread-dot"></span>' : "";
            html += '<div class="notif-item-label"><div class="notif-subject">' + item.subject + '</div><div class="notif-timestamp">' + item.timestamp + '</div></div>';
            html += '<button class="notif-expand mdi mdi-chevron-down" aria-label="Expand notification" aria-expanded="false"></button>';
            html += '<button class="notif-dismiss mdi mdi-close" aria-label="Dismiss notification"></button>';
            html += '<div class="notif-item-message">' + item.message + '</div>';
            div.innerHTML = html;
            listEl.appendChild(div);
          });
        }

        function updateCounts(popoverEl, listEl) {
          var all     = listEl.querySelectorAll(".notif-item");
          var unread  = listEl.querySelectorAll(".notif-item.unread");
          var totalEl  = popoverEl.querySelector(".notif-count-total");
          var unreadEl = popoverEl.querySelector(".notif-count-unread");
          if (totalEl)  totalEl.textContent  = all.length    + " Total";
          if (unreadEl) unreadEl.textContent = unread.length + " Unread";
        }

        function updateBellState(bellIconEl, bellBadgeEl, listEl) {
          var count = listEl ? listEl.querySelectorAll(".notif-item.unread").length : 0;
          if (count === 0) {
            if (bellIconEl)  { bellIconEl.classList.remove("mdi-bell"); bellIconEl.classList.add("mdi-bell-outline"); }
            if (bellBadgeEl) bellBadgeEl.textContent = "";
          } else {
            if (bellIconEl)  { bellIconEl.classList.remove("mdi-bell-outline"); bellIconEl.classList.add("mdi-bell"); }
            if (bellBadgeEl) bellBadgeEl.textContent = count > 99 ? "99+" : String(count);
          }
        }

        function _bellTooltip() {
          return window.Nimbus && Nimbus.Tooltip ? Nimbus.Tooltip.getInstance(document.getElementById("navBellBtn")) : null;
        }

        (function initUtilityNav() {
          var navEl          = document.getElementById("UtilityNav");
          var navBellBtn     = document.getElementById("navBellBtn");
          var navBellIcon    = document.getElementById("navBellIcon");
          var navBellBadge   = document.getElementById("navBellBadge");
          var navAlertPop    = document.getElementById("navAlertPopover");
          var notifListEl    = document.getElementById("notifList");
          var searchWrap     = document.getElementById("navSearchWrapper");
          var searchPanel    = document.getElementById("navSearchPanel");
          var searchInput    = document.getElementById("navSearchInput");
          var searchClearBtn = document.getElementById("navSearchClearBtn");
          var searchToggle   = document.getElementById("globalSearchBtn");
          var portalWrapper  = document.getElementById("portalSwitcherWrapper");
          var portalToggle   = document.getElementById("portalSwitcherToggle");
          var portalMenu     = document.getElementById("portalMenu");
          var portalChevron  = document.getElementById("portalChevron");
          var accountWrapper = document.getElementById("userAccountWrapper");
          var accountToggle  = document.getElementById("userAccountToggle");
          var accountMenu    = document.getElementById("accountMenu");
          var themeToggleBtn = document.getElementById("themeToggle");
          var filterBtn      = document.getElementById("navSearchFilter");

          var NAV_FIELDS_MIN_WIDTH = 435;
          var RESTORE_BUFFER = 24;
          var collapseNavWidth = 0;

          /* --- Notifications --- */
          if (notifListEl && navAlertPop) {
            renderDemoNotifications(notifListEl, DEMO_NOTIFICATIONS);
            updateCounts(navAlertPop, notifListEl);
            updateBellState(navBellIcon, navBellBadge, notifListEl);
          }

          /* --- Search panel --- */
          function animatePanel(fromPx, toPx, dur, cb) {
            searchPanel.style.transition = "none";
            searchPanel.style.maxWidth = fromPx + "px";
            requestAnimationFrame(function () {
              requestAnimationFrame(function () {
                searchPanel.style.transition = "max-width " + dur + "ms linear";
                searchPanel.style.maxWidth = toPx + "px";
                setTimeout(function () { searchPanel.style.transition = ""; searchPanel.style.maxWidth = ""; if (cb) cb(); }, dur);
              });
            });
          }

          function revealNavLabels() {
            if (!navEl) return;
            var labels = navEl.querySelectorAll(".portal-switcher-label, .user-name-label");
            [].forEach.call(labels, function (el) { el.style.maxWidth = "0"; el.style.overflow = "hidden"; });
            navEl.classList.remove("nav-labels-collapsed");
            collapseNavWidth = 0;
            void navEl.offsetWidth;
            [].forEach.call(labels, function (el) { el.style.transition = "max-width 0.4s ease-out"; el.style.maxWidth = "200px"; });
            setTimeout(function () { [].forEach.call(labels, function (el) { el.style.transition = ""; el.style.maxWidth = ""; el.style.overflow = ""; }); }, 400);
          }

          var prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

          function openPanel() {
            var target = searchWrap ? Math.max(searchWrap.offsetWidth - 40, NAV_FIELDS_MIN_WIDTH) : 600;
            searchPanel.classList.add("open");
            searchPanel.removeAttribute("aria-hidden");
            searchToggle.classList.add("active");
            searchToggle.setAttribute("aria-expanded", "true");
            searchToggle.setAttribute("aria-label", "Close search");
            searchToggle.setAttribute("data-cnds-original-title", "Close search");
            animatePanel(0, target, prefersReducedMotion ? 0 : 350, function () { if (searchInput) searchInput.focus(); });
          }

          function closePanel() {
            var cur = searchPanel.offsetWidth;
            searchPanel.classList.remove("open");
            searchPanel.setAttribute("aria-hidden", "true");
            searchToggle.setAttribute("aria-expanded", "false");
            searchToggle.setAttribute("aria-label", "Open search");
            searchToggle.setAttribute("data-cnds-original-title", "Open search");
            animatePanel(cur, 0, prefersReducedMotion ? 0 : 350, function () {
              searchToggle.classList.remove("active");
              if (searchToggle) searchToggle.focus();
              if (navEl && navEl.classList.contains("nav-labels-collapsed")) revealNavLabels();
              else collapseNavWidth = 0;
            });
          }

          if (searchToggle && searchPanel) {
            searchToggle.addEventListener("click", function () {
              if (searchPanel.classList.contains("open")) {
                closePanel();
              } else {
                var needsCollapse = navEl && searchWrap && (searchWrap.offsetWidth - 40) <= NAV_FIELDS_MIN_WIDTH;
                if (needsCollapse) {
                  collapseNavWidth = navEl.offsetWidth;
                  navEl.classList.add("nav-labels-collapsing", "nav-labels-collapsed");
                  setTimeout(function () { navEl.classList.remove("nav-labels-collapsing"); setTimeout(openPanel, 200); }, 400);
                } else {
                  openPanel();
                }
              }
            });
            if (window.ResizeObserver && navEl) {
              new ResizeObserver(function () {
                if (!searchPanel.classList.contains("open")) return;
                var fields = searchPanel.querySelector(".nav-search-fields");
                var nw = navEl.offsetWidth;
                if (!navEl.classList.contains("nav-labels-collapsed")) {
                  if (fields && fields.offsetWidth <= NAV_FIELDS_MIN_WIDTH) { collapseNavWidth = nw; navEl.classList.add("nav-labels-collapsed"); }
                } else if (nw > collapseNavWidth + RESTORE_BUFFER) {
                  navEl.classList.remove("nav-labels-collapsed"); collapseNavWidth = 0;
                }
              }).observe(navEl);
            }
          }

          if (searchPanel) {
            searchPanel.addEventListener("keydown", function (e) { if (e.key === "Escape") closePanel(); });
          }

          if (searchInput && searchClearBtn) {
            function syncClear() { searchClearBtn.classList.toggle("visible", searchInput.value.length > 0); }
            searchInput.addEventListener("input", syncClear);
            searchClearBtn.addEventListener("mousedown", function (e) { e.preventDefault(); searchInput.value = ""; syncClear(); searchInput.focus(); });
          }

          /* --- Bell popover --- */
          if (navBellBtn && navAlertPop) {
            document.body.appendChild(navAlertPop);

            function positionPopover() {
              var r  = navBellBtn.getBoundingClientRect();
              var pw = navAlertPop.offsetWidth || 400;
              navAlertPop.style.top = (r.bottom + 10) + "px";
              var cx   = r.left + r.width / 2;
              var left = Math.max(8, Math.min(cx - 20, window.innerWidth - pw - 8));
              navAlertPop.style.left = left + "px";
              navAlertPop.style.setProperty("--arrow-left", Math.max(12, Math.min(Math.round(cx - left - 8), pw - 32)) + "px");
            }
            function openPopover() {
              positionPopover();
              navAlertPop.classList.add("open");
              navAlertPop.removeAttribute("aria-hidden");
              navBellBtn.setAttribute("aria-expanded", "true");
              var bt = _bellTooltip(); if (bt) { bt.hide(); bt.disable(); }
              var firstFocusable = navAlertPop.querySelector("button, [href], input, [tabindex]");
              if (firstFocusable) firstFocusable.focus();
            }
            function closePopover() {
              navAlertPop.classList.remove("open");
              navAlertPop.setAttribute("aria-hidden", "true");
              navBellBtn.setAttribute("aria-expanded", "false");
              navBellBtn.focus();
              var bt = _bellTooltip(); if (bt) bt.enable();
            }

            navBellBtn.addEventListener("click", function (e) {
              e.stopPropagation();
              if (portalMenu)  { portalMenu.classList.remove("open");  if (portalToggle)  portalToggle.setAttribute("aria-expanded", "false"); }
              if (accountMenu) { accountMenu.classList.remove("open"); if (accountToggle) accountToggle.setAttribute("aria-expanded", "false"); }
              if (portalChevron) { portalChevron.classList.remove("mdi-chevron-up"); portalChevron.classList.add("mdi-chevron-down"); }
              if (navAlertPop.classList.contains("open")) { closePopover(); } else { openPopover(); }
            });
            navAlertPop.addEventListener("keydown", function (e) { if (e.key === "Escape") closePopover(); });
            window.addEventListener("resize", function () { if (navAlertPop.classList.contains("open")) positionPopover(); });
            document.addEventListener("click", function (e) {
              if (navAlertPop.classList.contains("open") && !navAlertPop.contains(e.target) && !navBellBtn.contains(e.target)) closePopover();
            });

            var nh = navAlertPop.querySelector(".notif-header");
            if (notifListEl && nh) notifListEl.addEventListener("scroll", function () { nh.classList.toggle("scrolled", this.scrollTop > 0); });

            navAlertPop.addEventListener("click", function (e) {
              var exp = e.target.closest(".notif-expand");
              if (exp) {
                e.preventDefault(); e.stopPropagation();
                var item = exp.closest(".notif-item"); if (!item) return;
                item.classList.toggle("expanded");
                exp.setAttribute("aria-expanded", item.classList.contains("expanded") ? "true" : "false");
                if (item.classList.contains("expanded") && item.classList.contains("unread")) {
                  item.classList.remove("unread");
                  var dot = item.querySelector(".notif-unread-dot"); if (dot) dot.remove();
                  updateCounts(navAlertPop, notifListEl);
                  updateBellState(navBellIcon, navBellBadge, notifListEl);
                }
                return;
              }
              var dis = e.target.closest(".notif-dismiss");
              if (!dis) return;
              e.preventDefault(); e.stopPropagation();
              var item = dis.closest(".notif-item"); if (!item) return;
              item.style.transition = "opacity 0.2s ease, max-height 0.3s ease, margin 0.3s ease, padding 0.3s ease";
              item.style.opacity = "0"; item.style.maxHeight = item.offsetHeight + "px"; item.style.overflow = "hidden";
              requestAnimationFrame(function () { item.style.maxHeight = "0"; item.style.marginTop = "0"; item.style.marginBottom = "0"; item.style.paddingTop = "0"; item.style.paddingBottom = "0"; });
              setTimeout(function () { item.remove(); updateCounts(navAlertPop, notifListEl); updateBellState(navBellIcon, navBellBadge, notifListEl); }, 300);
            });
          }

          /* --- Portal switcher --- */
          function refreshChevron() {
            if (!portalChevron) return;
            var open = portalMenu && portalMenu.classList.contains("open");
            portalChevron.classList.toggle("mdi-chevron-down", !open);
            portalChevron.classList.toggle("mdi-chevron-up", open);
          }
          function setMenuArrow(menu, trigger) {
            if (!menu || !trigger) return;
            var tw = trigger.offsetWidth;
            menu.style.setProperty("--menu-arrow-outer", Math.round(tw / 2 - 8) + "px");
            menu.style.setProperty("--menu-arrow-inner", Math.round(tw / 2 - 7) + "px");
          }

          /* The menus are position:fixed to escape #UtilityNav's overflow clip,
             so their coordinates have to be computed rather than inherited.
             The menu's RIGHT edge is aligned to the trigger's right edge, which
             is what keeps setMenuArrow()'s right-anchored arrow offsets correct. */
          function positionMenu(menu, trigger) {
            if (!menu || !trigger) return;
            var r = trigger.getBoundingClientRect();
            var w = menu.offsetWidth || 180;
            var left = Math.max(8, Math.min(r.right - w, window.innerWidth - w - 8));
            menu.style.top = (r.bottom + 12) + "px";
            menu.style.left = left + "px";
          }

          /* Keep open menus anchored while the viewport moves */
          function repositionOpenMenus() {
            if (portalMenu && portalMenu.classList.contains("open")) positionMenu(portalMenu, portalToggle);
            if (accountMenu && accountMenu.classList.contains("open")) positionMenu(accountMenu, accountToggle);
          }
          window.addEventListener("resize", repositionOpenMenus);
          window.addEventListener("scroll", repositionOpenMenus, { passive: true });
          function openPortalMenu() {
            if (accountMenu) { accountMenu.classList.remove("open"); accountMenu.setAttribute("aria-hidden", "true"); if (accountToggle) accountToggle.setAttribute("aria-expanded", "false"); }
            if (navAlertPop) { navAlertPop.classList.remove("open"); navAlertPop.setAttribute("aria-hidden", "true"); if (navBellBtn) navBellBtn.setAttribute("aria-expanded", "false"); }
            setMenuArrow(portalMenu, portalToggle);
            portalMenu.classList.add("open"); portalMenu.removeAttribute("aria-hidden");
            positionMenu(portalMenu, portalToggle);   /* after display:flex so offsetWidth is real */
            portalToggle.setAttribute("aria-expanded", "true"); refreshChevron();
            var first = portalMenu.querySelector("[role='menuitem']"); if (first) first.focus();
          }
          function closePortalMenu() {
            portalMenu.classList.remove("open"); portalMenu.setAttribute("aria-hidden", "true");
            portalToggle.setAttribute("aria-expanded", "false"); refreshChevron(); portalToggle.focus();
          }
          if (portalToggle && portalMenu) {
            portalToggle.addEventListener("click", function (e) { e.stopPropagation(); portalMenu.classList.contains("open") ? closePortalMenu() : openPortalMenu(); });
            portalToggle.addEventListener("keydown", function (e) {
              if (e.key === "Enter" || e.key === " ") { e.preventDefault(); portalMenu.classList.contains("open") ? closePortalMenu() : openPortalMenu(); }
              if (e.key === "Escape") closePortalMenu();
            });
            portalMenu.addEventListener("keydown", function (e) {
              if (e.key === "Escape") { closePortalMenu(); return; }
              if (e.key === "ArrowDown" || e.key === "ArrowUp") {
                e.preventDefault();
                var items = [].slice.call(portalMenu.querySelectorAll("[role='menuitem']"));
                var idx = items.indexOf(document.activeElement);
                items[(e.key === "ArrowDown" ? idx + 1 : idx - 1 + items.length) % items.length].focus();
              }
            });
            document.addEventListener("click", function (e) {
              if (portalMenu.classList.contains("open") && portalWrapper && !portalWrapper.contains(e.target)) closePortalMenu();
            });
          }

          /* --- User account --- */
          function openAccountMenu() {
            if (portalMenu)  { portalMenu.classList.remove("open");  portalMenu.setAttribute("aria-hidden", "true");  if (portalToggle)  { portalToggle.setAttribute("aria-expanded", "false");  refreshChevron(); } }
            if (navAlertPop) { navAlertPop.classList.remove("open"); navAlertPop.setAttribute("aria-hidden", "true"); if (navBellBtn)    navBellBtn.setAttribute("aria-expanded", "false"); }
            setMenuArrow(accountMenu, accountToggle);
            accountMenu.classList.add("open"); accountMenu.removeAttribute("aria-hidden");
            positionMenu(accountMenu, accountToggle);   /* after display:flex so offsetWidth is real */

            accountToggle.addEventListener("click", function (e) { e.stopPropagation(); accountMenu.classList.contains("open") ? closeAccountMenu() : openAccountMenu(); });
            accountToggle.addEventListener("keydown", function (e) {
              if (e.key === "Enter" || e.key === " ") { e.preventDefault(); accountMenu.classList.contains("open") ? closeAccountMenu() : openAccountMenu(); }
              if (e.key === "Escape") closeAccountMenu();

                var idx = items.indexOf(document.activeElement);
                items[(e.key === "ArrowDown" ? idx + 1 : idx - 1 + items.length) % items.length].focus();

        function fitSelectToLongestOption(id) {
          var el = document.getElementById(id);
          if (!el) return;
          var inst = Nimbus.Select.getInstance(el);
          if (!inst || !inst._wrapper || !inst._trigger) return;
          var cs = getComputedStyle(inst._trigger);
          var canvas = document.createElement("canvas");
          var ctx = canvas.getContext("2d");
          ctx.font = cs.font || '13px "Nunito Sans", sans-serif';
          var pl = parseFloat(cs.paddingLeft) || 12;
          var pr = parseFloat(cs.paddingRight) || 52;
          var maxTextW = Array.from(el.options).reduce(function (w, o) { return Math.max(w, ctx.measureText(o.text).width); }, 0);
          var fitW = Math.ceil(maxTextW + pl + pr + 2);
          inst._wrapper.style.width = fitW + "px";
          var origPosition = inst._positionDropdown.bind(inst);
          inst._positionDropdown = function () { origPosition(); inst._dropCont.style.width = fitW + "px"; };
          var countLabel = el.getAttribute("data-cnds-count-label") || "";
          if (countLabel && inst._isMultiple) {
            var origUpdate = inst._updateDisplay.bind(inst);
            inst._updateDisplay = function () {
              origUpdate();
              var selected = Array.from(el.options).filter(function (o) { return o.selected && o.value !== "" && !o.disabled; });
              if (selected.length > 1) inst._trigger.value = selected.length + " " + countLabel;
            };
          }
          if (inst._isMultiple) {
            inst._optList.addEventListener("click", function (e) {
              var li = e.target.closest(".select-option");
              if (!li || li.classList.contains("disabled")) return;
              var opt = li._selectOpt; if (!opt) return;
              e.stopPropagation(); e.stopImmediatePropagation();
              var allOpt = Array.from(el.options).find(function (o) { return o.hasAttribute("data-cnds-all-option"); });
              if (opt.hasAttribute("data-cnds-all-option")) {
                Array.from(el.options).forEach(function (o) { o.selected = false; });
                opt.selected = true; inst._syncOptionUI(); inst._dispatch("optionSelected.cnds.select"); inst.close();
              } else {
                if (allOpt) allOpt.selected = false;
                opt.selected = !opt.selected;
                li.classList.toggle("selected", opt.selected);
                li.setAttribute("aria-selected", opt.selected ? "true" : "false");
                var cb = li.querySelector(".form-check-input"); if (cb) cb.checked = opt.selected;
                var anySelected = Array.from(el.options).some(function (o) { return o.selected && !o.hasAttribute("data-cnds-all-option"); });
                if (!anySelected && allOpt) allOpt.selected = true;
                inst._syncOptionUI();
                inst._dispatch(opt.selected ? "optionSelected.cnds.select" : "optionDeselected.cnds.select");
              }
              inst._updateDisplay(); inst._dispatch("valueChanged.cnds.select");
            }, true);
            el.addEventListener("valueChanged.cnds.select", function () {
              var allOpt = Array.from(el.options).find(function (o) { return o.hasAttribute("data-cnds-all-option"); });
              if (!allOpt) return;
              var anySelected = Array.from(el.options).some(function (o) { return o.selected && !o.hasAttribute("data-cnds-all-option"); });
              if (!anySelected && !allOpt.selected) { allOpt.selected = true; inst._syncOptionUI(); inst._updateDisplay(); }
            });
          }
        }

                { key: "investigation", label: "Investigation", count: 10, color: "#9ccc3c", tone: "success" },
                { key: "audit",         label: "Audit",         count: 1,  color: "#3fc9b0", tone: "neutral" }
              ],
              items: [
                { id: "ca-1",  name: "Coyote v. ACME", category: "employment",    categoryLabel: "Employment" },
                { id: "ca-2",  name: "${case_name}",   category: "investigation", categoryLabel: "${case_category}" },
                { id: "ca-3",  name: "${case_name}",   category: "employment",    categoryLabel: "${case_category}" },
                { id: "ca-4",  name: "${case_name}",   category: "commercial",    categoryLabel: "${case_category}" },
                { id: "ca-5",  name: "${case_name}",   category: "audit",         categoryLabel: "${case_category}" },
                { id: "ca-6",  name: "${case_name}",   category: "employment",    categoryLabel: "${case_category}" },
                { id: "ca-7",  name: "${case_name}",   category: "investigation", categoryLabel: "${case_category}" },
                { id: "ca-8",  name: "${case_name}",   category: "investigation", categoryLabel: "${case_category}" },
                { id: "ca-9",  name: "${case_name}",   category: "commercial",    categoryLabel: "${case_category}" },
                { id: "ca-10", name: "${case_name}",   category: "investigation", categoryLabel: "${case_category}" }
              ]
            }
          ]
        };
        //*********************************************************************
        // END: SCREEN CONFIGURATION
        //*********************************************************************

        //*********************************************************************
        // START: SCREEN FUNCTIONALITY
        //*********************************************************************
        /* ─────────────────────────────────────────────────────────────────
           RENDERERS
           Pure functions of DASHBOARD_DATA — no markup is authored by hand.
           Angular: each render* below maps to a component template.
           ───────────────────────────────────────────────────────────────── */

        var ICON_BASE = "../img/cf/core/";

        /* Run fn once Nimbus components exist. cnds.ready is a one-shot event,
           so anything registering after boot (a re-render, a later card) must
           fall through to calling fn immediately. */
        function whenNimbusReady(fn) {
          if (window.Nimbus && window.Nimbus.Chart && window.Nimbus.Select) fn();
          else document.addEventListener("cnds.ready", fn, { once: true });
        }

        /* System-message dismiss: fade out, then collapse so the page slides up */
        var ALERT_FADE_MS  = 300;
        var ALERT_SLIDE_MS = 300;
        /* Half of the list crossfade — out and back in, so a toggle costs 2x this */
        var FILTER_FADE_MS = 150;
        /* Requires Action slide */
        var ACCORDION_MS   = 300;

        function esc(s) {
          return String(s == null ? "" : s)
            .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
        }

        function el(html) {
          var t = document.createElement("template");
          t.innerHTML = html.trim();
          return t.content.firstElementChild;
        }

        /* Derived values — nothing here is ever authored by hand.
           badge    — ALWAYS the number of rows in the card. One rule for every
                      card on the screen (including the Requires Action queue,
                      which counts its own rows), so a badge can never disagree
                      with what is actually listed beneath it.
           subtitle — derived from cases/custodians. */
        function deriveCard(card) {
          return {
            count: card.items ? card.items.length : 0,
            subtitle: (card.cases != null && card.custodians != null)
              ? "Across " + card.cases + " cases & " + card.custodians + " custodians"
              : null
          };
        }

        /* ── Alert ─────────────────────────────────────────────────────── */
        function renderAlert(mount, alert) {
          mount.innerHTML = "";
          if (!alert) return;
          var node = el(
            '<div class="alert alert-' + esc(alert.variant) + (alert.dismissible ? " alert-dismissible" : "") + '" role="alert">' +
              '<i class="mdi mdi-information mdi-18px me-2" aria-hidden="true"></i>' +
              '<span>' + esc(alert.message) + '</span>' +
              (alert.dismissible ? '<button type="button" class="btn-close" aria-label="Dismiss"></button>' : "") +
            '</div>'
          );
          /* Dismiss in two phases:
               1. fade the banner out over ALERT_FADE_MS
               2. collapse the mount's height over ALERT_SLIDE_MS, which pulls
                  everything below it smoothly up to close the gap
             The mount stays a flex child of .cfd-root throughout, so the 16px
             row gap is constant and only the height animates — no negative
             margin needed to cancel it.
             Each phase ends on transitionend, with a timeout fallback so the
             banner can never get stranded mid-animation. */
          var close = node.querySelector(".btn-close");
          if (close) close.addEventListener("click", function () {
            close.disabled = true;

            if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
              node.remove();
              return;
            }

            function once(el, prop, ms, run) {
              var done = false;
              function finish() { if (done) return; done = true; run(); }
              el.addEventListener("transitionend", function (e) {
                if (e.propertyName === prop) finish();
              });
              setTimeout(finish, ms + 60);
            }

            /* phase 2 — collapse the mount so the page slides up.
               Height alone leaves the parent's row-gap behind, so the gap is
               absorbed with a negative margin animated alongside it. Without
               that the page would jump the last 16px when :empty finally takes
               the mount out of the flex flow. */
            function slideUp() {
              var h = mount.getBoundingClientRect().height;
              var gap = parseFloat(getComputedStyle(mount.parentNode).rowGap) || 0;
              mount.style.overflow = "hidden";
              mount.style.height = h + "px";
              mount.style.marginBottom = "0px";
              void mount.offsetHeight;          /* flush so height has a start value */
              mount.style.transition = "height " + ALERT_SLIDE_MS + "ms ease, " +
                                       "margin-bottom " + ALERT_SLIDE_MS + "ms ease";
              mount.style.height = "0px";
              mount.style.marginBottom = -gap + "px";
              once(mount, "height", ALERT_SLIDE_MS, function () {
                node.remove();                  /* mount is now :empty -> display:none */
                mount.style.transition = "";
                mount.style.height = "";
                mount.style.marginBottom = "";
                mount.style.overflow = "";
              });
            }

            /* phase 1 — fade */
            node.style.transition = "opacity " + ALERT_FADE_MS + "ms ease";
            void node.offsetWidth;
            node.style.opacity = "0";
            once(node, "opacity", ALERT_FADE_MS, slideUp);
          });
          mount.appendChild(node);
        }

        /* ── Requires Action queue ─────────────────────────────────────── */
        function renderActionQueue(mount, countEl, rows) {
          mount.innerHTML = "";
          countEl.textContent = rows.length;
          if (!rows.length) {
            mount.appendChild(el('<div class="cfd-empty">Nothing requires action.</div>'));
            return;
          }
          var qFrag = document.createDocumentFragment();
          rows.forEach(function (row) {
            var mod = row.severity && row.severity !== "default" ? " cfd-action-row--" + row.severity : "";
            qFrag.appendChild(el(
              '<div class="cfd-action-row' + mod + '" data-id="' + esc(row.id) + '">' +
                '<div class="cfd-action-row-text">' +
                  '<span class="cfd-action-row-title">' + esc(row.title) + '</span>' +
                  (row.note ? '<span class="cfd-action-row-sub">' + esc(row.note) + '</span>' : "") +
                '</div>' +
                '<span class="cfd-action-row-div" aria-hidden="true"></span>' +
                '<button type="button" class="cfd-view" aria-label="View ' + esc(row.title) + '">View</button>' +
              '</div>'
            ));
          });
          mount.appendChild(qFrag);
        }

        /* ── Shared card chrome ────────────────────────────────────────── */
        function cardShell(card) {
          var d = deriveCard(card);
          var node = el(
            '<section class="cfd-card" data-card="' + esc(card.id) + '" aria-labelledby="cfd-h-' + esc(card.id) + '">' +
              '<header class="cfd-card-top">' +
                '<span class="cfd-card-icon" aria-hidden="true" style="-webkit-mask-image:url(' + ICON_BASE + esc(card.icon) + ');mask-image:url(' + ICON_BASE + esc(card.icon) + ')"></span>' +
                '<div class="cfd-card-titles">' +
                  '<h2 class="cfd-card-title" id="cfd-h-' + esc(card.id) + '">' + esc(card.title) + '</h2>' +
                  (d.subtitle ? '<div class="cfd-card-sub">' + esc(d.subtitle) + '</div>' : "") +
                '</div>' +
                '<span class="cfd-card-badge">' + d.count + '</span>' +
                /* Drag handle. It is a real <button> so it is focusable and can
                   drive keyboard reordering; Sortable only arms draggable when
                   the pointer goes down on this element, which keeps the status
                   tiles clickable and the lists scrollable. */
                '<button type="button" class="cfd-card-grip" ' +
                        'aria-label="Reorder ' + esc(card.title) + '. Use left and right arrow keys to move." ' +
                        'title="Drag to reorder">' +
                  '<i class="mdi mdi-drag" aria-hidden="true"></i>' +
                '</button>' +
              '</header>' +
            '</section>'
          );
          return node;
        }

        /* ── Donut ring — Nimbus .progress-circular ────────────────────── */
        function renderRing(ring) {
          var caption = (ring.done != null && ring.total != null) ? ring.done + " of " + ring.total : "";
          return '<div class="cfd-ring-wrap cfd-t-' + esc(ring.tone || "success") + '">' +
                   '<span class="cfd-ring-label">' + esc(ring.label) + '</span>' +
                   '<div class="progress progress-circular" style="--percentage:' + Number(ring.pct) + '" ' +
                        'role="progressbar" aria-valuenow="' + Number(ring.pct) + '" aria-valuemin="0" aria-valuemax="100" ' +
                        'aria-label="' + esc(ring.label) + '">' +
                     '<div class="progress-bar"></div>' +
                     '<span class="progress-label">' + Number(ring.pct) + '%</span>' +
                   '</div>' +
                   (caption ? '<span class="cfd-ring-caption">' + esc(caption) + '</span>' : "") +
                 '</div>';
        }

        /* ── Stat card (7 of 9) ────────────────────────────────────────── */
        function statItemHTML(item) {
          var icon = STATUS_ICON[item.status] || "mdi-circle-small";
          var tone = toneFor(item.status);
          return '<article class="cfd-item cfd-t-' + tone + '" data-status="' + esc(item.status) + '" data-id="' + esc(item.id) + '">' +
                   '<div class="cfd-item-main">' +
                     '<span class="cfd-item-name">' + esc(item.name) + '</span>' +
                     '<span class="cfd-item-case">' + esc(item.case) + '</span>' +
                     '<div class="cfd-item-status cfd-t-' + tone + '">' +
                       '<i class="mdi ' + icon + '" aria-hidden="true"></i>' +
                       '<span>' + esc(item.statusText) + '</span>' +
                     '</div>' +
                     (item.extra
                       ? '<div class="cfd-item-status cfd-item-status--plain"><i class="mdi ' + esc(item.extra.icon) + '" aria-hidden="true"></i><span>' + esc(item.extra.text) + '</span></div>'
                       : "") +
                     (item.note
                       ? '<span class="cfd-item-note cfd-t-' + esc(item.noteTone || "neutral") + '">' + esc(item.note) + '</span>'
                       : "") +
                     '<button type="button" class="cfd-view" aria-label="View ' + esc(item.name) + '">View</button>' +
                   '</div>' +
                   (item.ring ? renderRing(item.ring) : "") +
                 '</article>';
        }

        function renderStatCard(card) {
          var node = cardShell(card);

          var stats = el('<div class="cfd-stats" role="group" aria-label="' + esc(card.title) + ' status filters"></div>');
          card.stats.forEach(function (s) {
            stats.appendChild(el(
              '<button type="button" class="cfd-stat cfd-t-' + esc(s.tone) + '" data-status="' + esc(s.key) + '" aria-pressed="false">' +
                '<span class="cfd-stat-label">' + esc(s.label) + '</span>' +
                '<span class="cfd-stat-value">' + esc(s.value) + '</span>' +
              '</button>'
            ));
          });
          node.appendChild(stats);
          node.appendChild(el('<div class="cfd-card-divider" aria-hidden="true"></div>'));

          var list = el('<div class="cfd-list cfd-list--inset"></div>');
          list.innerHTML = card.items.map(statItemHTML).join("");
          node.appendChild(list);

          /* Status tiles filter the list. Angular: emit (statusFilter) instead. */
          stats.addEventListener("click", function (e) {
            var btn = e.target.closest(".cfd-stat");
            if (!btn) return;
            var on = btn.getAttribute("aria-pressed") === "true";
            stats.querySelectorAll(".cfd-stat").forEach(function (b) { b.setAttribute("aria-pressed", "false"); });
            btn.setAttribute("aria-pressed", on ? "false" : "true");
            /* dim the unselected tiles while a filter is active */
            stats.classList.toggle("has-selection", !on);
            applyFilter(list, on ? null : btn.dataset.status);
          });

          return node;
        }

        /* Crossfade a list between two filter states.
           The visibility swap happens at the midpoint, while the list is fully
           transparent, so the reflow is never seen — the two states dissolve
           into one another instead of snapping.
           Re-entrant: a toggle mid-animation cancels the pending phase and
           restarts, so fast clicking can't strand the list at opacity 0. */
        function fadeSwap(list, commit) {
          if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) { commit(); return; }
          if (list._swapT) { clearTimeout(list._swapT); list._swapT = null; }

          list.style.transition = "opacity " + FILTER_FADE_MS + "ms ease";
          list.style.opacity = "0";

          list._swapT = setTimeout(function () {
            commit();
            list.scrollTop = 0;          /* the new set should start at the top */
            void list.offsetHeight;      /* flush before fading back in */
            list.style.opacity = "1";
            list._swapT = setTimeout(function () {
              list.style.transition = "";
              list.style.opacity = "";
              list._swapT = null;
            }, FILTER_FADE_MS + 20);
          }, FILTER_FADE_MS);
        }

        function applyFilter(list, status) {
          fadeSwap(list, function () {
            var shown = 0;
            list.querySelectorAll(".cfd-item").forEach(function (it) {
              var match = !status || it.dataset.status === status;
              it.hidden = !match;
              if (match) shown++;
            });
            var empty = list.querySelector(".cfd-empty");
            if (!shown && !empty) list.appendChild(el('<div class="cfd-empty">No matching records.</div>'));
            if (shown && empty) empty.remove();
          });
        }

        /* ── Interviews card ───────────────────────────────────────────── */
        function renderInterviewsCard(card) {
          var node = cardShell(card);
          var list = el('<div class="cfd-list"></div>');
          list.innerHTML = card.items.map(function (i) {
            return '<article class="cfd-item cfd-item--interview" data-id="' + esc(i.id) + '">' +
                     '<div class="cfd-datebox" aria-hidden="true">' +
                       '<div class="cfd-datebox-m">' + esc(i.month) + '</div>' +
                       '<div class="cfd-datebox-d">' + esc(i.day) + '</div>' +
                       '<div class="cfd-datebox-y">' + esc(i.year) + '</div>' +
                     '</div>' +
                     '<div class="cfd-item-main">' +
                       '<span class="cfd-iv-time">' + esc(i.time) + '</span>' +
                       '<span class="cfd-iv-case">' + esc(i.case) + '</span>' +
                       '<span class="cfd-iv-person">' + esc(i.person) + '</span>' +
                       '<span class="cfd-iv-purpose">' + esc(i.purpose) + '</span>' +
                     '</div>' +
                     '<span class="cfd-item-div" aria-hidden="true"></span>' +
                     '<button type="button" class="cfd-view" aria-label="View interview with ' + esc(i.person) + '">View</button>' +
                   '</article>';
          }).join("");
          node.appendChild(list);
          return node;
        }

        /* ── Cases card — chart + category filter + list ───────────────── */
        function renderCasesCard(card) {
          var node = cardShell(card);

          var chart = el('<div class="cfd-chart" id="cfdCasesChart"></div>');
          node.appendChild(chart);

          var selId = "cfdCasesCategory";
          var filter = el(
            '<div class="cfd-filter">' +
              '<label class="cfd-filter-label" for="' + selId + '">Category</label>' +
              '<select id="' + selId + '" aria-label="Category" data-cnds-select-init data-cnds-placeholder="All">' +
                '<option value="" selected>All</option>' +
                card.categories.map(function (c) {
                  return '<option value="' + esc(c.key) + '">' + esc(c.label) + '</option>';
                }).join("") +
              '</select>' +
            '</div>'
          );
          node.appendChild(filter);

          var list = el('<div class="cfd-list"></div>');
          list.innerHTML = card.items.map(function (c) {
            var cat = card.categories.filter(function (x) { return x.key === c.category; })[0];
            /* dot colour comes from the category's chart colour so the list and
               the bar chart can never disagree */
            var dot = cat ? ' style="--cfd-tone:' + esc(cat.color) + '"' : "";
            return '<article class="cfd-item cfd-item--case" data-category="' + esc(c.category) + '" data-id="' + esc(c.id) + '">' +
                     '<div class="cfd-item-main">' +
                       '<span class="cfd-item-name">' + esc(c.name) + '</span>' +
                       '<span class="cfd-item-cat">' +
                         '<span class="cfd-dot" aria-hidden="true"' + dot + '></span>' + esc(c.categoryLabel) +
                       '</span>' +
                     '</div>' +
                     '<span class="cfd-item-div" aria-hidden="true"></span>' +
                     '<button type="button" class="cfd-view" aria-label="View ' + esc(c.name) + '">View</button>' +
                   '</article>';
          }).join("");
          node.appendChild(list);

          /* Nimbus components load async. cnds.ready fires ONCE, so a listener
             registered after boot would never run — use whenNimbusReady so a
             re-render still builds the chart and select. */
          whenNimbusReady(function () {
            if (window.Nimbus && Nimbus.Chart) {
              new Nimbus.Chart(chart, {
                type: "bar",
                indexAxis: "y",
                height: 182,
                showLegend: false,
                animated: false,
                valueLabels: true,
                labels: card.categories.map(function (c) { return c.label; }),
                datasets: [{
                  label: "Cases",
                  /* one colour per category — charts.js resolves the array
                     per bar in both the vertical and horizontal branches */
                  data: card.categories.map(function (c) { return c.count; }),
                  backgroundColor: card.categories.map(function (c) { return c.color; })
                }],
                padding: { top: 8, right: 16, bottom: 28, left: 88 }
              });
            }
            var sel = document.getElementById(selId);
            if (sel) {
              sel.addEventListener("valueChanged.cnds.select", function () { applyCategory(list, sel.value); });
              sel.addEventListener("change", function () { applyCategory(list, sel.value); });
            }
          });

          return node;
        }

        function applyCategory(list, category) {
          fadeSwap(list, function () {
            var shown = 0;
            list.querySelectorAll(".cfd-item").forEach(function (it) {
              var match = !category || it.dataset.category === category;
              it.hidden = !match;
              if (match) shown++;
            });
            var empty = list.querySelector(".cfd-empty");
            if (!shown && !empty) list.appendChild(el('<div class="cfd-empty">No matching cases.</div>'));
            if (shown && empty) empty.remove();
          });
        }

        /* ── Orchestrator ──────────────────────────────────────────────── */
        var CARD_RENDERERS = {
          stat:       renderStatCard,
          interviews: renderInterviewsCard,
          cases:      renderCasesCard
        };

        /* ─────────────────────────────────────────────────────────────────
           CARD ORDER — per user, persistent across sessions.

           ►►► THE ONLY PLACE STORAGE IS DECIDED ◄◄◄
           Both functions are callback-based so the backing store can be
           swapped for an async one without touching any caller:

             cookie:  read/write document.cookie in load/save
             API:     GET/PUT /api/ca/preferences/dashboard-layout
                      load: fetch(...).then(r => r.json()).then(o => cb(o.order))
                      save: fetch(..., {method:"PUT", body: JSON.stringify({order:ids})})

           Contract: an array of card ids, e.g. ["cases","legal-holds",...].
           Unknown ids are ignored and missing ids fall to the end, so the
           stored order stays valid when cards are added or removed.
           ───────────────────────────────────────────────────────────────── */
        var LayoutStore = {
          KEY: "cf.dashboard.cardOrder",

          load: function (cb) {
            var order = null;
            try {
              var raw = window.localStorage.getItem(this.KEY);
              if (raw) order = JSON.parse(raw);
            } catch (e) { order = null; }   /* private mode / disabled storage */
            cb(Array.isArray(order) ? order : null);
          },

          save: function (ids, cb) {
            try { window.localStorage.setItem(this.KEY, JSON.stringify(ids)); }
            catch (e) { /* non-fatal: order simply won't persist */ }
            if (cb) cb();
          },

          clear: function (cb) {
            try { window.localStorage.removeItem(this.KEY); } catch (e) {}
            if (cb) cb();
          }
        };

        /* Reorder cards[] to match a stored id list. Ids not in the list keep
           their original relative position at the end. */
        function applyOrder(cards, order) {
          if (!order || !order.length) return cards.slice();
          var byId = {};
          cards.forEach(function (c) { byId[c.id] = c; });
          var out = [];
          order.forEach(function (id) { if (byId[id]) { out.push(byId[id]); delete byId[id]; } });
          cards.forEach(function (c) { if (byId[c.id]) out.push(c); });
          return out;
        }

        function currentOrder() {
          return [].map.call(
            document.querySelectorAll("#cfdGrid .cfd-card"),
            function (c) { return c.dataset.card; }
          );
        }

        /* Reorder the cards ALREADY IN THE DOM rather than re-rendering them.
           appendChild moves an existing node, so drag bindings, the chart SVG
           and the initialised select all survive. Re-rendering destroys them:
           Sortable's listeners live on the card elements, and the chart is
           built inside a one-shot ready handler. */
        function applyOrderToDom(order) {
          var grid = document.getElementById("cfdGrid");
          if (!grid) return;
          var nodes = {};
          [].forEach.call(grid.querySelectorAll(".cfd-card"), function (c) {
            nodes[c.dataset.card] = c;
          });
          var ids = (order && order.length)
            ? order
            : (DASHBOARD_DATA.cards || []).map(function (c) { return c.id; });

          /* Moves are batched through a fragment: appending an existing node
             to a fragment detaches it once, and the grid re-lays out a single
             time on insert rather than on every move. */
          var frag = document.createDocumentFragment();
          ids.forEach(function (id) {
            if (nodes[id]) { frag.appendChild(nodes[id]); delete nodes[id]; }
          });
          /* anything the stored order didn't name keeps its default position */
          (DASHBOARD_DATA.cards || []).forEach(function (c) {
            if (nodes[c.id]) frag.appendChild(nodes[c.id]);
          });
          grid.appendChild(frag);
        }

        function renderDashboard(data, order) {
          renderAlert(document.getElementById("cfdAlert"), data.alert);
          renderActionQueue(
            document.getElementById("cfdActionsInner"),
            document.getElementById("cfdActionsCount"),
            data.requiresAction || []
          );

          var grid = document.getElementById("cfdGrid");
          grid.innerHTML = "";
          /* Build into a fragment so the grid lays out once instead of
             re-flowing after each of the nine cards. */
          var frag = document.createDocumentFragment();
          applyOrder(data.cards || [], order).forEach(function (card) {
            var fn = CARD_RENDERERS[card.type];
            if (fn) frag.appendChild(fn(card));
          });
          grid.appendChild(frag);
          syncResetVisibility(data);
        }

        /* Requires Action collapse — collapsed by default, per Figma */
        /* Requires Action — slide open/closed.
           height:auto is not animatable, so each direction runs between explicit
           pixel values; on open the height is released back to auto once the
           transition lands so the panel can reflow if its contents change. */
        (function initActionAccordion() {
          var btn   = document.getElementById("cfdActionsBtn");
          var body  = document.getElementById("cfdActionsBody");
          var inner = document.getElementById("cfdActionsInner");
          if (!btn || !body || !inner) return;

          function settle(run) {
            var done = false;
            function finish() { if (done) return; done = true; run(); }
            body.addEventListener("transitionend", function (e) {
              if (e.propertyName === "height") finish();
            });
            setTimeout(finish, ACCORDION_MS + 60);
          }

          btn.addEventListener("click", function () {
            var isOpen = btn.getAttribute("aria-expanded") === "true";
            btn.setAttribute("aria-expanded", isOpen ? "false" : "true");

            if (body._slideT) { clearTimeout(body._slideT); body._slideT = null; }

            if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
              body.style.height = isOpen ? "0px" : "auto";
              return;
            }

            var target = inner.getBoundingClientRect().height;

            if (isOpen) {
              /* closing: pin the current height, flush, then run to 0 */
              body.style.height = target + "px";
              void body.offsetHeight;
              body.style.transition = "height " + ACCORDION_MS + "ms ease";
              body.style.height = "0px";
              settle(function () { body.style.transition = ""; });
            } else {
              /* opening: 0 -> measured height, then release to auto */
              body.style.height = "0px";
              void body.offsetHeight;
              body.style.transition = "height " + ACCORDION_MS + "ms ease";
              body.style.height = target + "px";
              settle(function () {
                body.style.transition = "";
                if (btn.getAttribute("aria-expanded") === "true") body.style.height = "auto";
              });
            }
          });
        })();

        /* ─────────────────────────────────────────────────────────────────
           REORDERING
           Mouse: Nimbus.Sortable (HTML5 DnD), armed only from the grip.
           Keyboard: the grip is a button — arrow keys move the card, so the
           feature is not mouse-only. Both paths funnel through persistOrder().
           ───────────────────────────────────────────────────────────────── */

        function announce(msg) {
          var live = document.getElementById("cfdLive");
          if (live) live.textContent = msg;
        }

        function persistOrder() {
          var ids = currentOrder();
          LayoutStore.save(ids);
          syncResetVisibility(DASHBOARD_DATA);
          return ids;
        }

        /* Reset is only offered once the order actually differs from default */
        function syncResetVisibility(data) {
          var bar = document.getElementById("cfdLayoutBar");
          if (!bar) return;
          var def = (data.cards || []).map(function (c) { return c.id; }).join(",");
          bar.classList.toggle("visible", currentOrder().join(",") !== def);
        }

        function moveCard(card, dir) {
          var grid = document.getElementById("cfdGrid");
          var cards = [].slice.call(grid.querySelectorAll(".cfd-card"));
          var i = cards.indexOf(card);
          var j = i + dir;
          if (i < 0 || j < 0 || j >= cards.length) return false;
          if (dir > 0) grid.insertBefore(cards[j], card);
          else grid.insertBefore(card, cards[j]);
          persistOrder();
          var title = card.querySelector(".cfd-card-title").textContent;
          announce(title + " moved to position " + (j + 1) + " of " + cards.length);
          card.querySelector(".cfd-card-grip").focus();
          return true;
        }

        (function initReorder() {
          var grid = document.getElementById("cfdGrid");
          if (!grid) return;

          /* keyboard: arrows move, Home/End jump to the ends */
          grid.addEventListener("keydown", function (e) {
            var grip = e.target.closest(".cfd-card-grip");
            if (!grip) return;
            var card = grip.closest(".cfd-card");
            var handled = true;
            if (e.key === "ArrowRight" || e.key === "ArrowDown")      moveCard(card, 1);
            else if (e.key === "ArrowLeft" || e.key === "ArrowUp")    moveCard(card, -1);
            else if (e.key === "Home")  { while (moveCard(card, -1)) {} }
            else if (e.key === "End")   { while (moveCard(card, 1)) {} }
            else handled = false;
            if (handled) e.preventDefault();
          });

          /* highlight the card being keyboard-moved */
          grid.addEventListener("focusin", function (e) {
            var grip = e.target.closest(".cfd-card-grip");
            grid.querySelectorAll(".cfd-card--kbd").forEach(function (c) { c.classList.remove("cfd-card--kbd"); });
            if (grip) grip.closest(".cfd-card").classList.add("cfd-card--kbd");
          });
          grid.addEventListener("focusout", function (e) {
            var grip = e.target.closest(".cfd-card-grip");
            if (grip) grip.closest(".cfd-card").classList.remove("cfd-card--kbd");
          });

          /* mouse: Nimbus Sortable loads with the component bundle */
          document.addEventListener("cnds.ready", function () {
            if (window.Nimbus && Nimbus.Sortable) {
              new Nimbus.Sortable(grid, {
                items: ".cfd-card",
                handle: ".cfd-card-grip",
                animation: 150
              });
              grid.addEventListener("end.cnds.sortable", persistOrder);
              grid.addEventListener("sort.cnds.sortable", persistOrder);
            }
          });

          var reset = document.getElementById("cfdLayoutReset");
          if (reset) reset.addEventListener("click", function () {
            LayoutStore.clear(function () {
              /* move the existing cards back — never re-render, or the drag
                 bindings, chart and select are destroyed along with the nodes */
              applyOrderToDom(null);
              syncResetVisibility(DASHBOARD_DATA);
              announce("Card layout reset to default order.");
            });
          });
        })();

        /* Hydrate stored order, then render. With an async store this becomes
           the natural await point — no caller changes needed. */
        LayoutStore.load(function (order) {
          renderDashboard(DASHBOARD_DATA, order);
        });
        //*********************************************************************
        // END: SCREEN FUNCTIONALITY
        //*********************************************************************

      }());
    </script>
