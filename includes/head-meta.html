<!-- ═══════════════════ META ═══════════════════════════════════════════
     Nimbus v1 Portable — Standard head meta block
     Include inside <head> before any <link> tags.
     Replace {{PAGE_TITLE}} and {{PAGE_DESCRIPTION}} when injecting.
     ════════════════════════════════════════════════════════════════════ -->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
<meta name="description" content="{{PAGE_DESCRIPTION}}" />
<title>{{PAGE_TITLE}}</title>
